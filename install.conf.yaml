- defaults:
    link:
      create: true
      relink: true
      force: true

- create:
  - ~/Developer
  - ~/bin

# Oh-My-Zsh must exist before the link step creates ~/.oh-my-zsh/themes.
# A dir without oh-my-zsh.sh is a broken install: back it up, then clone.
- shell:
  - description: Installing Oh-My-Zsh
    command: >-
      [ -f ~/.oh-my-zsh/oh-my-zsh.sh ] || {
      [ ! -e ~/.oh-my-zsh ] || mv ~/.oh-my-zsh ~/.oh-my-zsh.bak.$(date +%s);
      git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git ~/.oh-my-zsh; }
    stdout: true
    stderr: true

- link:
    ~/AGENTS.md:
      path: AGENTS.md
    ~/.claude/CLAUDE.md:
      path: AGENTS.md
    ~/.gitconfig:
      path: gitconfig
    ~/.gitignore:
      path: gitignore
    ~/.tm_properties:
      path: tm_properties
    ~/.zshrc:
      path: zshrc
    ~/.oh-my-zsh/themes/caiofbpa.zsh-theme:
      path: caiofbpa.zsh-theme
    ~/bin/fresh:
      path: bin/fresh

- shell:
  # Formulae, sorted by formula name (tap prefix ignored).
  - brew install -f ack
  - brew install -f atlassian/acli/acli
  - brew install -f autojump
  - brew install -f awscli
  - brew install -f dockutil
  - brew install -f gh
  - brew install -f git
  - brew install -f git-lfs
  - brew install -f mas
  - brew install -f nodenv
  - brew install -f pyenv
  - brew install -f hashicorp/tap/terraform
  - brew install -f tree
  - brew install -f yt-dlp
  - brew install -f zsh-completions
  - brew install -f zsh-history-substring-search
  - brew install -f zsh-syntax-highlighting

  # Casks. Slack and WhatsApp come from casks, not mas, to get fixes before App Store review.
  - brew install -f --cask chatgpt
  - brew install -f --cask claude
  - brew install -f --cask claude-code@latest
  - brew install -f --cask codex
  - brew install -f --cask codexbar
  - brew install -f --cask cursor
  - brew install -f --cask cursor-cli
  - brew install -f --cask docker-desktop
  - brew install -f --cask elgato-studio
  - brew install -f --cask gcloud-cli
  - brew install -f --cask github
  - brew install -f --cask github-copilot-app
  - brew install -f --cask google-chrome
  - brew install -f --cask grok-bot
  - brew install -f --cask iina
  - brew install -f --cask lm-studio
  - brew install -f --cask opencode-desktop
  - brew install -f --cask sentry-cli
  - brew install -f --cask slack
  - brew install -f --cask visual-studio-code
  - brew install -f --cask whatsapp
  - brew install -f --cask zoom

  # App Store apps, sorted by app name. mas needs a manual App Store sign-in first
  # and installs only apps this Apple ID already has.
  - mas install 1358823008  # Flighty
  - mas install 375589283   # Parcel
  - mas install 6475002485  # Reeder
  - mas install 1153157709  # Speedtest

  # Other installers. zshrc already adds ~/.grok/bin to PATH; skip the installer when grok exists.
  - '[ -x ~/.grok/bin/grok ] || curl -fsSL https://x.ai/cli/install.sh | bash'

# Point ~/Downloads at iCloud Drive > Downloads, in the Finder sidebar and in the Dock.
# A plain link step cannot do this: macOS puts a deny-delete ACL on ~/Downloads.
# The step removes that ACL, then removes the folder only when it is empty, so no
# download is lost. It runs after the brew step because it needs dockutil.
- shell:
  - description: Linking ~/Downloads to iCloud Drive
    command: >-
      icloud="$HOME/Library/Mobile Documents/com~apple~CloudDocs";
      [ -d "$icloud" ] || { echo "Turn on iCloud Drive, then run ./install again."; exit 1; };
      mkdir -p "$icloud/Downloads";
      if [ -e ~/Downloads ] && [ ! -L ~/Downloads ]; then
      chmod -N ~/Downloads; rm -f ~/Downloads/.DS_Store; rmdir ~/Downloads || exit 1; fi;
      ln -sfn "$icloud/Downloads" ~/Downloads;
      swift -suppress-warnings finder-favorite.swift "$icloud/Downloads" || exit 1;
      defaults read com.apple.dock persistent-others | grep -q "CloudDocs/Downloads/" ||
      dockutil --add "$icloud/Downloads" --replacing Downloads --section others
      --view fan --display stack --sort dateadded
    stdout: true
    stderr: true
